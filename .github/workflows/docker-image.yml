name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./jdk
          file: ./jdk/Dockerfile-21
          platforms: linux/amd64,linux/arm64,linux/arm64/v8,linux/riscv64
          push: true
          tags: |
             jetlinks/base-jdk-21
             registry.cn-shenzhen.aliyuncs.com/jetlinks/base-jdk-21
      - uses: docker/build-push-action@v6
        with:
          context: ./jdk
          file: ./jdk/Dockerfile-21-all
          platforms: linux/amd64,linux/arm64,linux/arm64/v8,linux/riscv64
          push: true
          tags: |
             jetlinks/base-jdk-21-all
             registry.cn-shenzhen.aliyuncs.com/jetlinks/base-jdk-21-all
